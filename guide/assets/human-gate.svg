<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">What your human gate does</title>
  <desc id="desc">After the reviewer, your gate sends each PR one of three ways: to a person, back to Claude to fix what the reviewer found, or on to merge. Code in the gate, your reviewer and a specialist agent can each tell it that a person should look.</desc>
  <style>
    .t{font-size:14.5px;font-weight:600;fill:#241a35} .s{font-size:12.5px;fill:#6c6480} .m{text-anchor:middle}
    .track{stroke:#ddd6ea;stroke-width:4;stroke-linecap:round;fill:none}
    .feed{stroke:#c3b5e3;stroke-width:2;fill:none;stroke-dasharray:2 6;stroke-linecap:round}
    .stop{fill:#fff;stroke:#241a35;stroke-width:2.5}
  </style>
  <rect width="960" height="330" rx="16" fill="#faf9fc"/>
  <path d="M190 74C190 140 420 120 420 172M420 74V172M650 74C650 140 420 120 420 172" class="feed"/>
  <circle cx="190" cy="66" r="7" style="fill:#efeaf8;stroke:#5a3e9b;stroke-width:2"/><text x="190" y="36" class="t m">Code</text><text x="190" y="52" class="s m">files, size, did checks finish?</text>
  <circle cx="420" cy="66" r="7" style="fill:#efeaf8;stroke:#5a3e9b;stroke-width:2"/><text x="420" y="36" class="t m">Your reviewer</text><text x="420" y="52" class="s m">calls alert_human</text>
  <circle cx="650" cy="66" r="7" style="fill:#efeaf8;stroke:#5a3e9b;stroke-width:2"/><text x="650" y="36" class="t m">A specialist agent</text><text x="650" y="52" class="s m">one question per PR</text>

  <path d="M80 190H700M420 190C520 190 560 100 700 100M420 190C520 190 560 280 700 280" class="track"/>
  <circle r="6" fill="#5a3e9b"><animateMotion dur="9s" repeatCount="indefinite" path="M80 190H420C520 190 560 100 700 100" keyPoints="0;0.52;0.52;1;1" keyTimes="0;0.12;0.2;0.3;1" calcMode="linear"/><animate attributeName="fill" dur="9s" repeatCount="indefinite" values="#5a3e9b;#5a3e9b;#d98e1f;#d98e1f" keyTimes="0;0.18;0.2;1"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.3;0.31;1"/></circle>
  <circle r="6" fill="#5a3e9b"><animateMotion dur="9s" begin="-6s" repeatCount="indefinite" path="M80 190H700" keyPoints="0;0.548;0.548;1;1" keyTimes="0;0.12;0.2;0.3;1" calcMode="linear"/><animate attributeName="fill" begin="-6s" dur="9s" repeatCount="indefinite" values="#5a3e9b;#5a3e9b;#c0503f;#c0503f" keyTimes="0;0.18;0.2;1"/><animate attributeName="opacity" begin="-6s" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.3;0.31;1"/></circle>
  <circle r="6" fill="#5a3e9b"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" path="M80 190H420C520 190 560 280 700 280" keyPoints="0;0.52;0.52;1;1" keyTimes="0;0.12;0.2;0.3;1" calcMode="linear"/><animate attributeName="fill" begin="-3s" dur="9s" repeatCount="indefinite" values="#5a3e9b;#5a3e9b;#2f7d5b;#2f7d5b" keyTimes="0;0.18;0.2;1"/><animate attributeName="opacity" begin="-3s" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.3;0.31;1"/></circle>

  <circle cx="80" cy="190" r="10" class="stop"/><text x="80" y="222" class="t m">A reviewed PR</text><text x="80" y="239" class="s m">it passed your checks</text>
  <circle cx="420" cy="190" r="14" class="stop"/><text x="420" y="226" class="t m">Your gate</text><text x="420" y="243" class="s m">route() in scripts/gate.py</text>
  <circle cx="700" cy="100" r="10" style="fill:#fdf2df;stroke:#d98e1f;stroke-width:2.5"/><text x="722" y="97" class="t">A person looks</text><text x="722" y="114" class="s">in human-review-queue.md</text>
  <circle cx="700" cy="190" r="10" style="fill:#c0503f;stroke:#c0503f;stroke-width:2.5"/><text x="722" y="187" class="t">Back to Claude</text><text x="722" y="204" class="s">to fix what the reviewer found</text>
  <circle cx="700" cy="280" r="10" style="fill:#2f7d5b;stroke:#2f7d5b;stroke-width:2.5"/><text x="722" y="277" class="t">Merge</text><text x="722" y="294" class="s">nothing needs a person</text>
</svg>
