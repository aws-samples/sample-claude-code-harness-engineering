<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How your reviewer agent runs</title>
  <desc id="desc">For each PR, the lab makes one headless Claude Code call. It gets the PR, your agent file as its only instructions, and, if you allow them, tools to read the rest of the code. It replies with a verdict and findings.</desc>
  <style>
    .t{font-size:14.5px;font-weight:600;fill:#241a35} .s{font-size:12.5px;fill:#6c6480}
    .r{text-anchor:end} .m{text-anchor:middle}
    .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;fill:#241a35}
    .track{stroke:#ddd6ea;stroke-width:4;stroke-linecap:round;fill:none}
    .stop{fill:#fff;stroke:#241a35;stroke-width:2.5}
    .out{opacity:0}
  </style>
  <rect width="960" height="300" rx="16" fill="#faf9fc"/>
  <path d="M300 70C400 70 400 150 500 150M300 150H500M300 230C400 230 400 150 500 150M500 150H620" class="track"/>
  <g fill="#5a3e9b">
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" path="M300 70C400 70 400 150 500 150" keyPoints="0;0;1;1" keyTimes="0;0.05;0.3;1" calcMode="linear"/></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" path="M300 150H500" keyPoints="0;0;1;1" keyTimes="0;0.05;0.3;1" calcMode="linear"/></circle>
    <circle r="6"><animateMotion dur="6s" repeatCount="indefinite" path="M300 230C400 230 400 150 500 150" keyPoints="0;0;1;1" keyTimes="0;0.05;0.3;1" calcMode="linear"/></circle>
  </g>
  <circle cx="300" cy="70" r="10" class="stop"/><text x="280" y="67" class="t r">The PR</text><text x="280" y="84" class="s r">its description and diff</text>
  <circle cx="300" cy="150" r="10" class="stop" style="fill:#efeaf8;stroke:#5a3e9b"/><text x="280" y="147" class="t r">Your agent file</text><text x="280" y="164" class="s r">its only instructions</text>
  <circle cx="300" cy="230" r="10" class="stop" style="stroke-dasharray:4 3"/><text x="280" y="227" class="t r">Tools, if you allow them</text><text x="280" y="244" class="s r">Read, Grep and Glob, to see more code</text>
  <circle cx="500" cy="150" r="14" class="stop"><animate attributeName="r" dur="6s" repeatCount="indefinite" values="14;14;19;14;14" keyTimes="0;0.3;0.38;0.46;1"/></circle>
  <text x="500" y="196" class="t m">One Claude Code call</text><text x="500" y="213" class="s m">headless, on Haiku, one per PR</text>
  <text x="650" y="88" class="t">It replies</text>
  <g class="code">
    <text x="650" y="118">{"verdict": "request_changes",<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.42;0.46;0.94;1"/></text>
    <text x="650" y="140">&#160;"findings": [{"rule": "R5",<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.48;0.52;0.94;1"/></text>
    <text x="650" y="162">&#160;&#160;"why": "retries a send that<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.54;0.58;0.94;1"/></text>
    <text x="650" y="184">&#160;&#160;may already have gone"}]}<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6;0.64;0.94;1"/></text>
  </g>
</svg>
